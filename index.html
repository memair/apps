<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apps | Memair</title>
    <meta name="description" content="The Memair app directory is closed for now. Apps can still connect to Memair through its API.">
    <link rel="icon" href="/favicon.ico">
    <style>
      :root {
        --bg: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --link: #0969da;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --text: #e6edf3;
          --muted: #9198a1;
          --link: #4493f8;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      main {
        max-width: 36rem;
        margin: 0 auto;
        padding: 4rem 1rem;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.3;
        margin: 1.5rem 0 1rem;
      }
      p {
        margin: 0 0 1rem;
      }
      a {
        color: var(--link);
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <a href="https://memair.com"><img src="/img/memair_logo.png" alt="Memair" width="75"></a>
      <h1>The Memair app directory is closed for now</h1>
      <p>Apps can still connect to Memair. They ask the user for access through OAuth and read and write data through the GraphQL API.</p>
      <p>The <a href="https://docs.memair.com">developer docs</a> explain how to register an app and use the API.</p>
      <p class="muted">Back to <a href="https://memair.com">memair.com</a>.</p>
    </main>
  </body>
</html>
